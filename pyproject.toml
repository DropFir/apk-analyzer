[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apkba-analyzer"
version = "0.3.9"
description = "Editor-facing APK/XAPK analyzer and end-to-end evidence packaging tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "androguard>=4.1,<5",
  "Pillow>=10.4,<13",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11,<7",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
apkba-analyzer = "apkba_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apkba_analyzer = ["assets/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
